name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Build web app
        env:
          GEMINI_PROXY_URL: ${{ vars.GEMINI_PROXY_URL }}
        run: |
          if [ -n "$GEMINI_PROXY_URL" ]; then
            flutter build web --release --base-href "/${GITHUB_REPOSITORY#*/}/" --dart-define="GEMINI_PROXY_URL=$GEMINI_PROXY_URL"
          else
            flutter build web --release --base-href "/${GITHUB_REPOSITORY#*/}/"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4